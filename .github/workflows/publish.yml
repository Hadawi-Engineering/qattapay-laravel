name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, test + archive but do not notify Packagist"
        type: boolean
        required: false
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, curl, xml, dom
          coverage: none
          tools: composer:v2

      - name: Validate tag shape
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be vX.Y.Z (got ${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "Publishing Composer version ${TAG_VERSION}"
          echo "TAG_VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

      - name: Archive (smoke-check)
        run: |
          mkdir -p dist
          composer archive --format=zip --file="dist/qattapay-laravel-${TAG_VERSION:-local}"
          ls -la dist/
          unzip -l "dist/qattapay-laravel-${TAG_VERSION:-local}.zip" | head -40

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: qattapay-laravel-${{ env.TAG_VERSION || 'local' }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Notify Packagist
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/v') }}
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "${PACKAGIST_USERNAME}" ] || [ -z "${PACKAGIST_TOKEN}" ]; then
            echo "No Packagist secrets set — relying on GitHub service hook / manual update."
            exit 0
          fi
          curl -sS -X POST \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/Hadawi-Engineering/qattapay-laravel"}}'

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run complete — tests passed and archive built; Packagist was not notified."
          ls -la dist/
